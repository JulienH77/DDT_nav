<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navigation Bâtiment – 3D Wayfinding</title>

  <!-- Leaflet for 2D base -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Three.js for 3D view -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- ─── TOP BAR ─────────────────────────────────────────── -->
  <header id="topbar">
    <div id="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect x="2" y="14" width="11" height="12" rx="1" fill="var(--accent)"/>
        <rect x="15" y="8" width="11" height="18" rx="1" fill="var(--accent)" opacity=".7"/>
        <rect x="8" y="2" width="12" height="10" rx="1" fill="var(--accent)" opacity=".45"/>
      </svg>
      <span>Bâtiment Nav</span>
    </div>

    <!-- ROUTE SELECTOR -->
    <div id="route-bar">
      <div class="route-field">
        <label>Départ</label>
        <select id="sel-from">
          <option value="">— Choisir un bureau —</option>
        </select>
      </div>
      <div id="arrow-icon">→</div>
      <div class="route-field">
        <label>Destination</label>
        <select id="sel-to">
          <option value="">— Choisir un bureau —</option>
        </select>
      </div>
      <button id="btn-go">Tracer le chemin</button>
      <button id="btn-reset" title="Réinitialiser">✕</button>
    </div>

    <!-- FLOOR TABS -->
    <div id="floor-tabs">
      <button class="ftab active" data-floor="rdc">Rdc</button>
      <button class="ftab" data-floor="1er">1er étage</button>
      <button class="ftab" data-floor="all">Vue 3D</button>
    </div>
  </header>

  <!-- ─── MAIN CANVAS ──────────────────────────────────────── -->
  <main id="main">

    <!-- 2D MAP (Leaflet) -->
    <div id="map-container">
      <div id="map"></div>
      <!-- Legend -->
      <div id="legend">
        <div class="leg-item"><span class="leg-dot" style="background:var(--col-bat-a)"></span> Bât. A</div>
        <div class="leg-item"><span class="leg-dot" style="background:var(--col-bat-b)"></span> Bât. B</div>
        <div class="leg-item"><span class="leg-dot" style="background:var(--col-bat-c)"></span> Bât. C</div>
        <div class="leg-item"><span class="leg-dot" style="background:var(--col-start)"></span> Départ</div>
        <div class="leg-item"><span class="leg-dot" style="background:var(--col-end)"></span> Arrivée</div>
      </div>
    </div>

    <!-- 3D VIEW (Three.js) -->
    <div id="view3d-container" style="display:none">
      <canvas id="canvas3d"></canvas>
      <div id="controls-hint">🖱 Clic + glisser pour orbiter · Molette pour zoomer</div>
      <div id="animation-bar" style="display:none">
        <button id="btn-play">▶ Rejouer l'animation</button>
        <div id="progress-wrap"><div id="progress-bar"></div></div>
      </div>
    </div>

  </main>

  <!-- ─── INFO PANEL ────────────────────────────────────────── -->
  <div id="info-panel" style="display:none">
    <div id="info-header">
      <span id="info-title">Itinéraire</span>
      <button id="info-close">✕</button>
    </div>
    <div id="info-steps"></div>
  </div>

  <!-- ─── TOAST ─────────────────────────────────────────────── -->
  <div id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/map2d.js"></script>
  <script src="js/view3d.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
